name: cf-key-export
on:
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CF_API_TOKEN }}
      ACC: d740a05e9442c1d0feacae2dfc673e93
    steps:
      - name: perms
        run: |
          H="Authorization: Bearer $T"
          echo "PAGES:  $(curl -s -o /tmp/p -w '%{http_code}' -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects") $(jq -c '[.result[]?.name]' /tmp/p 2>/dev/null) $(jq -c '.errors' /tmp/p)"
          echo "WORKERS: $(curl -s -o /tmp/w -w '%{http_code}' -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts") $(jq -c '[.result[]?.id]' /tmp/w 2>/dev/null) $(jq -c '.errors' /tmp/w)"
          echo "ACCTOK: $(curl -s -o /tmp/a -w '%{http_code}' -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACC/tokens") $(jq -c '.errors' /tmp/a)"
          echo "ZONES:  $(curl -s -o /tmp/z -w '%{http_code}' -H "$H" "https://api.cloudflare.com/client/v4/zones") $(jq -c '.result|length' /tmp/z) $(jq -c '.errors' /tmp/z)"
