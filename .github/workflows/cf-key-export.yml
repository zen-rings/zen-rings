name: cf-key-export
on:
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CF_API_TOKEN }}
      ACC: d740a05e9442c1d0feacae2dfc673e93
    steps:
      - name: cleanup
        run: |
          curl -s -X DELETE -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$ACC/tokens/7e4a4f08f276f8ae46c8f4e9c5e0cf4d" | jq -c .
          curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$ACC/tokens" | jq -c '[.result[]?|{name,status}]'
