name: ring-hygiene
# Housekeeping for the repositories in the pool ring.
#
# What it is for: a pool worker is a GitHub Actions run, so a busy ring leaves dozens of identical
# `zen-pool` runs in each member repository. This workflow walks the ring registry (the same
# `GET /zen/ring/payload` the provisioner uses), borrows each repository's own token for the duration
# of the run, and deletes finished runs and artifacts older than `keep_hours`. It also makes sure
# Actions are enabled with a read-only default token, and can give the pool workflow a readable
# display name.
#
# Two rules, not one: finished runs older than `keep_hours`, AND at most `max_runs` finished runs
# kept per repository. GitHub delays `schedule` in this ring by hours (measured: the `*/2` pool scaler
# ran 5h late), so the age window alone cannot be the guarantee — the cap is what keeps a repository's
# Actions tab bounded even when the trigger arrives a day late or never arrives at all.
#
# The window is 27 minutes (0.45 h), because a pool worker lives at most 30 minutes: by the time its
# run is finished it is already history. The odd number is deliberate — a cutoff on an hour boundary
# would sweep a whole hour of workers at once. `ensure_sweep` also carries this window into each ring
# repository, where the worker sweeps its own finished runs on the way out.
#
# It also prunes this repository's own finished runs (`self`, on by default): the registry does not
# contain the housekeeping repository, so without that row its Actions tab is the one place nothing
# ever prunes. The self row carries its own token (`github.token` + `actions: write`) and only ever
# prunes runs and artifacts — it does not harden or rename anything here.
#
# What it never does: it does not touch the contents of a ring repository beyond the single `name:`
# line of the pool workflow, and it never prints, stores or forwards a token. Tokens come from the
# registry at runtime and are `add-mask`ed before the script starts, exactly like zen-ring-sync.
#
# This repository is public: inputs and logs are readable by anyone — which is why no token is ever an
# input.

on:
  schedule:
    # The retention window is 27 minutes, so a tick has to be finer than that or the effective
    # retention is the window plus the tick (an hourly tick would hold a finished run for 27–87 min).
    # Off-round minutes on purpose: GitHub fires cron at :00 in an unusually large burst, and a
    # housekeeping job has no business joining it. The age window is a nicety — `max_runs`/`max_artifacts`
    # are what bound the tab when GitHub delivers the trigger hours late, which it does in this ring.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      keep_hours:
        description: 'keep finished runs/artifacts newer than this many hours (0.45 = 27 minutes)'
        default: '0.45'
      max_runs:
        description: 'keep at most this many finished runs per repository (0 = no cap)'
        default: '20'
      max_artifacts:
        description: 'keep at most this many finished artifacts per repository (0 = no cap)'
        default: '20'
      prune_runs:
        description: 'delete finished workflow runs older than keep_hours and beyond max_runs'
        type: boolean
        default: true
      prune_artifacts:
        description: 'delete artifacts older than keep_hours'
        type: boolean
        default: true
      harden:
        description: 'ensure Actions are enabled and the default workflow token is read-only'
        type: boolean
        default: true
      rename_workflows:
        description: 'set a human-readable display name on the pool workflow (name: line only)'
        type: boolean
        default: false
      friendly_name:
        description: 'display name used when rename_workflows is on'
        default: 'Zen Pool — inference worker'
      repos:
        description: 'comma-separated owner/name filter (empty = every enabled ring row)'
        default: ''
      self:
        description: "also prune this repository's own finished runs/artifacts (needs no ring row)"
        type: boolean
        default: true
      ensure_sweep:
        description: "make sure every ring repository's worker workflow carries the current sweep window"
        type: boolean
        default: true
      dry_run:
        description: 'report what would be deleted/changed without deleting or changing anything'
        type: boolean
        default: false

permissions:
  contents: read
  # The self sweep deletes finished runs of this repository, which the default read-only token cannot do.
  actions: write

concurrency:
  group: ring-hygiene
  cancel-in-progress: false

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: read ring rows
        env:
          BASE: ${{ vars.ZEN_RUNNER_URL }}
          RING_ADMIN: ${{ secrets.ZEN_RING_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .ring
          code=$(curl -sS -o .ring/payload.json -w '%{http_code}' \
            -H "authorization: Bearer $RING_ADMIN" -H 'accept: application/json' "$BASE/zen/ring/payload")
          if [ "$code" != "200" ]; then
            echo "::error::the ring registry did not answer ($code) — fix ZEN_RING_ADMIN_TOKEN in this repo."
            exit 1
          fi
          jq -c '.repos' .ring/payload.json > .ring/ring.json
          node -e 'const a=JSON.parse(require("fs").readFileSync(".ring/ring.json","utf8")); if(!Array.isArray(a)||!a.length) throw new Error("ring rows are not a non-empty JSON array"); console.log("RING_ROWS="+a.length)'
          # A token fetched at runtime is not masked by GitHub on its own — mask it before anything runs.
          jq -r '.[] | (.token // empty), (.resolved_token // empty)' .ring/ring.json | while IFS= read -r t; do
            if [ -n "$t" ]; then echo "::add-mask::$t"; fi
          done

      - name: run hygiene
        env:
          ARGS: >-
            ${{ inputs.prune_runs && '--prune-runs' || '' }}
            ${{ inputs.prune_artifacts && '--prune-artifacts' || '' }}
            ${{ inputs.harden && '--harden' || '' }}
            ${{ inputs.rename_workflows && '--rename-workflows' || '' }}
            ${{ inputs.dry_run && '--dry-run' || '' }}
            ${{ inputs.ensure_sweep && '--ensure-sweep' || '' }}
          KEEP_HOURS: ${{ inputs.keep_hours }}
          MAX_RUNS: ${{ inputs.max_runs }}
          MAX_ARTIFACTS: ${{ inputs.max_artifacts }}
          FRIENDLY: ${{ inputs.friendly_name }}
          REPOS: ${{ inputs.repos }}
          SELF: ${{ inputs.self }}
          SELF_REPO: ${{ github.repository }}
          SELF_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # On schedule there are no inputs: default to the full sweep with a 27 minute window, a cap
          # and the sweep refresh. The window and the cap are deliberately NOT left to the workflow
          # default — the schedule path has no inputs, so these fallbacks are what actually apply when
          # nobody ticks a box, and they are the numbers the owner asked for.
          if [ -z "${ARGS// }" ]; then ARGS='--prune-runs --prune-artifacts --harden --ensure-sweep'; fi
          # Same for `self`: on schedule the boolean input is absent, and the self sweep is exactly the
          # part that must not depend on someone ticking a box.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -z "$SELF" ]; then SELF=true; fi
          SELF_ARG=''
          if [ "$SELF" = "true" ] && [ -n "$SELF_REPO" ]; then SELF_ARG="--self $SELF_REPO"; fi
          ZEN_HYGIENE_SELF_TOKEN="$SELF_TOKEN" node scripts/ring-hygiene.mjs --ring .ring/ring.json \
            --keep-hours "${KEEP_HOURS:-0.45}" --max-runs "${MAX_RUNS:-20}" --max-artifacts "${MAX_ARTIFACTS:-20}" \
            --friendly-name "${FRIENDLY:-Zen Pool — inference worker}" --repos "${REPOS:-}" $ARGS $SELF_ARG
          rm -f .ring/ring.json .ring/payload.json

      - name: ring state
        if: always()
        env:
          BASE: ${{ vars.ZEN_RUNNER_URL }}
        run: |
          echo "--- zen/health ---"; curl -sS "$BASE/zen/health"; echo
          echo "--- zen/pool/health ---"; curl -sS "$BASE/zen/pool/health"; echo
