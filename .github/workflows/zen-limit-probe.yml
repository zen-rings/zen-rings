name: zen-limit-probe
on:
  workflow_dispatch:
    inputs:
      requests:
        description: 'requests per runner'
        default: '400'
      concurrency:
        description: 'concurrency per runner'
        default: '4'
      model:
        description: 'zen free model'
        default: 'mimo-v2.6-flash-free'
      prompt:
        description: 'user message'
        default: 'ping'
      max_tokens:
        description: 'max_tokens'
        default: '8'
      model_after:
        description: 'fire one request at this model right after the first 429 (shared-bucket test)'
        default: ''
      same_ip:
        description: 'true = shard 1 fires both streams inside ONE job (one egress IP): the same-IP sharing test'
        default: 'false'
      delay_ms:
        description: 'delay between request starts per worker'
        default: '0'
      fill_tokens:
        description: 'comma-separated context sizes to probe (e.g. 100000,500000,1050000); empty = off'
        default: ''

# Issue #106: two PARALLEL runners (matrix) = two different Azure egress IPs, same anonymous
# zen fingerprint. If the free-tier limit is per-IP, each runner trips its own budget; if it
# is shared, both trip at the same request count. The probe script writes a JSON report per
# runner; the summary is printed to the log and the report uploaded as an artifact.
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      # The free tier is metered per (egress IP, model), so the IP is part of every result: two
      # shards that land on the same IP share one budget, two on different IPs do not.
      - name: record egress ip
        run: |
          IP=$(curl -s --max-time 10 https://api.ipify.org || echo unknown)
          echo "EGRESS_IP=$IP" >> "$GITHUB_ENV"
          echo "POOL egress_ip runner=${{ matrix.shard }} ip=$IP" >> "$GITHUB_STEP_SUMMARY"
      - name: zen probe from runner ${{ matrix.shard }}
        run: |
          # same_ip: shard 1 fires BOTH streams in this one job, so they share this job's egress
          # IP. If the free-tier budget is per IP, the pair trips it at ~half the requests of a
          # single stream; if it is per stream, the pair gets double.
          CONC="${{ inputs.concurrency }}"
          if [ "${{ inputs.same_ip }}" = "true" ] && [ "${{ matrix.shard }}" = "1" ]; then CONC=2; fi
          MODEL_AFTER_ARG=""
          if [ -n "${{ inputs.model_after }}" ]; then MODEL_AFTER_ARG="--model-after ${{ inputs.model_after }}"; fi
          FILL_ARG=""
          if [ -n "${{ inputs.fill_tokens }}" ]; then FILL_ARG="--fill-tokens ${{ inputs.fill_tokens }}"; fi
          node scripts/zen-limit-probe.mjs \
            --requests ${{ inputs.requests }} \
            --concurrency "$CONC" \
            --model ${{ inputs.model }} \
            --prompt "${{ inputs.prompt }}" \
            --max-tokens ${{ inputs.max_tokens }} \
            --delay-ms ${{ inputs.delay_ms }} \
            $FILL_ARG \
            $MODEL_AFTER_ARG \
            --out zen-probe-gh-${{ matrix.shard }}.json
      - name: fingerprint cross-check runner ${{ matrix.shard }}
        if: always()
        run: |
          node scripts/zen-limit-probe.mjs --requests 1 --header 'user-agent: opencode/9.99.99 ai-sdk/provider-utils/4.0.23 runtime/bun/1.3.14' --out zen-fp-gh-${{ matrix.shard }}.json
      - name: summary runner ${{ matrix.shard }}
        if: always()
        run: |
          node -e "
            const r = require('./zen-probe-gh-${{ matrix.shard }}.json');
            const s = r.summary;
            console.log('GH runner ${{ matrix.shard }} @ ' + new Date(r.startedAt).toISOString());
            console.log('  ok=' + s.ok + ' http429=' + s.http429 + ' other=' + s.otherErrors + ' first429At=' + s.first429At);
            console.log('  usageTotals=' + JSON.stringify(s.usageTotals));
            const ra = s.retryAfterSeries.filter(x => x.retryAfterSec != null);
            if (ra.length) console.log('  retry-after: ' + ra[0].retryAfterSec + ' → ' + ra[ra.length-1].retryAfterSec);
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zen-probe-gh-${{ matrix.shard }}
          path: zen-probe-gh-${{ matrix.shard }}.json
