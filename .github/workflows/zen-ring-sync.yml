name: zen-ring-sync
# Zen Pool ring — provision ring repositories and (re)register their rows in the pool registry.
#
# One place where "which repositories are in the ring and with which token" lives: the JSON payload
# in the ZEN_RING_PAYLOAD secret. Nothing about a token is ever printed or passed as a workflow
# input — a public repository's dispatch inputs and logs are readable by anyone.
#
# Payload = JSON array, one object per ring member:
#   [{ "repo": "owner/name", "location": "eu", "token": "ghp_…" | "token_ref": "env:NAME" }]
# `token` is stored by the worker encrypted (ZEN_TOKEN_KEY); `token_ref` keeps the GitHub token in a
# worker secret instead. A row without either keeps whatever the registry already has for that repo.
#
# Provisioning writes into each ring repo: .github/workflows/zen-pool.yml, scripts/zen-pool-worker.mjs,
# scripts/zen-client.mjs, the ZEN_RUNNER_URL variable and the ZEN_RUNNER_TOKEN secret — i.e. exactly
# what a pool worker needs to boot. Each row's own `token` is used for that write path (per-repo
# ring); GH_RING_ADMIN_PAT is only the fallback for a row that carries no token.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'register = upsert rows, disable = turn rows off, list = no writes at all'
        type: choice
        options: [register, disable, list]
        default: register
      provision:
        description: 'write the worker files/vars/secrets into each ring repo before registering'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: read ring payload
        id: payload
        env:
          RING_PAYLOAD: ${{ secrets.ZEN_RING_PAYLOAD }}
        run: |
          set -euo pipefail
          mkdir -p .ring
          if [ -n "${RING_PAYLOAD:-}" ]; then
            printf '%s' "$RING_PAYLOAD" > .ring/ring.json
          else
            printf '[]' > .ring/ring.json
          fi
          node -e 'const a=JSON.parse(require("fs").readFileSync(".ring/ring.json","utf8")); if(!Array.isArray(a)||!a.length) throw new Error("payload is not a non-empty JSON array"); for (const r of a) if(!/^[\w.-]+\/[\w.-]+$/.test(r.repo||"")) throw new Error("bad repo: "+r.repo); console.log("RING_ROWS="+a.length)'

      - name: provision ring repositories
        if: ${{ inputs.provision }}
        env:
          ADMIN_PAT: ${{ secrets.GH_RING_ADMIN_PAT }}
          RUNNER_URL: ${{ vars.ZEN_RUNNER_URL }}
          RUNNER_TOKEN: ${{ secrets.ZEN_RUNNER_TOKEN }}
          DAILY_BUDGET: '8000'
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RUNNER_TOKEN" > /tmp/runner-token
          # Each row carries its own token: the ring is per-repo, so provisioning must be too.
          # A row without a token falls back to GH_RING_ADMIN_PAT (kept for the legacy path).
          jq -c '.[]' .ring/ring.json | while read -r row; do
            repo=$(jq -r '.repo' <<<"$row")
            pat=$(jq -r '.token // empty' <<<"$row")
            if [ -z "$pat" ]; then pat="${ADMIN_PAT:-}"; fi
            if [ -z "$pat" ]; then echo "provision $repo skipped — no token in row and no GH_RING_ADMIN_PAT"; continue; fi
            for f in .github/workflows/zen-pool.yml scripts/zen-pool-worker.mjs scripts/zen-client.mjs; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -H "authorization: Bearer $pat" -H 'accept: application/vnd.github+json' "https://api.github.com/repos/$repo/contents/$f")
              if [ "$code" = "200" ]; then echo "provision $repo $f present"; continue; fi
              jq -n --arg msg "zen-pool: add $f" --arg content "$(base64 -w0 < "$f")" \
                '{message:$msg, content:$content, branch:"main"}' > /tmp/req.json
              code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PUT \
                -H "authorization: Bearer $pat" -H 'accept: application/vnd.github+json' -H 'content-type: application/json' \
                "https://api.github.com/repos/$repo/contents/$f" --data @/tmp/req.json)
              echo "provision $repo $f PUT=$code $(jq -r '.message // "ok"' /tmp/resp.json 2>/dev/null || echo ok)"
            done
            code=$(GH_TOKEN="$pat" gh variable set ZEN_RUNNER_URL --repo "$repo" --body "$RUNNER_URL" >/dev/null 2>&1; echo $?)
            echo "provision $repo var ZEN_RUNNER_URL rc=$code"
            code=$(GH_TOKEN="$pat" gh variable set ZEN_DAILY_BUDGET --repo "$repo" --body "$DAILY_BUDGET" >/dev/null 2>&1; echo $?)
            echo "provision $repo var ZEN_DAILY_BUDGET rc=$code"
            code=$(GH_TOKEN="$pat" gh secret set ZEN_RUNNER_TOKEN --repo "$repo" < /tmp/runner-token >/dev/null 2>&1; echo $?)
            echo "provision $repo secret ZEN_RUNNER_TOKEN rc=$code"
          done
          rm -f /tmp/runner-token

      - name: register ring rows
        if: ${{ inputs.mode != 'list' }}
        env:
          MODE: ${{ inputs.mode }}
          BASE: ${{ vars.ZEN_RUNNER_URL }}
          RUNNER_TOKEN: ${{ secrets.ZEN_RUNNER_TOKEN }}
        run: |
          set -euo pipefail
          jq -c '.[]' .ring/ring.json | while read -r row; do
            repo=$(jq -r '.repo' <<<"$row")
            if [ "$MODE" = "disable" ]; then
              jq -c '{repo, enabled:false}' <<<"$row" > /tmp/body.json
            else
              jq -c '{repo, location:(.location // ""), enabled:true}
                     + (if .token then {token:.token} else {} end)
                     + (if .token_ref then {token_ref:.token_ref} else {} end)' <<<"$row" > /tmp/body.json
            fi
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$BASE/zen/repos" \
              -H "authorization: Bearer $RUNNER_TOKEN" -H 'content-type: application/json' --data @/tmp/body.json)
            echo "register $repo http=$code $(jq -r '.error // "ok"' /tmp/resp.json 2>/dev/null || echo ok)"
          done

      - name: ring state
        if: always()
        env:
          BASE: ${{ vars.ZEN_RUNNER_URL }}
        run: |
          echo "--- zen/health ---"; curl -sS "$BASE/zen/health"; echo
          echo "--- zen/pool/health ---"; curl -sS "$BASE/zen/pool/health"; echo