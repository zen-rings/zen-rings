name: zen-ring-sync
# Zen Pool ring — provision ring repositories and (re)register their rows in the pool registry.
#
# Where "which repositories are in the ring and with which token" lives: the `zen_repos` table in the
# worker's own D1 database. This workflow asks the worker for that list (`GET /zen/ring/payload`) and
# writes nothing secret of its own — there is no ring payload in GitHub secrets and no spreadsheet
# behind it. The worker and the provisioner read the same row, so they cannot drift apart.
#
# Adding a repository is the owner's job and needs no agent: put the new rows in ONE repository
# secret named ZEN_RING_IMPORT (a JSON array, see the shape below) and run this workflow with
# `source: gh-import`. The workflow reads the secret, masks every token, writes the rows into the
# worker registry (encrypted) and provisions the new repositories. Nothing is printed.
#
# Two tokens, deliberately not one:
#   ZEN_RUNNER_TOKEN      the low-privilege one, provisioned into every ring repo (call models, report);
#   ZEN_RING_ADMIN_TOKEN  never leaves this repo + the owner's terminal; reads the registry and the
#                         plaintext tokens. A ring member must not be able to read the ring.
#
# Payload rows look like:
#   { "repo": "owner/name", "location": "eu", "token": "ghp_…" }        — token stored encrypted
#   { "repo": "owner/name", "token_ref": "env:NAME" }                   — token lives in a worker secret
#   { "repo": "owner/name", "enabled": false }                         — switched off, row kept
# A row with neither `token` nor `token_ref` keeps whatever the registry already has for that repo.
#
# Provisioning writes into each ring repo: .github/workflows/zen-pool.yml, scripts/zen-pool-worker.mjs,
# scripts/zen-client.mjs, the ZEN_RUNNER_URL variable and the ZEN_RUNNER_TOKEN secret — i.e. exactly
# what a pool worker needs to boot. The worker code itself is pulled from the ladder repo (below), not
# from this repo, so a worker change lands in the ring on the next sync.
#
# This repository is public: Actions inputs and logs are readable by anyone. No token is ever passed as
# an input, printed, or echoed; every token read from the registry is `add-mask`ed before anything can
# print it.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'register = upsert rows, disable = turn rows off, list = no writes at all'
        type: choice
        options: [register, disable, list]
        default: register
      source:
        description: 'cf = read the ring from the worker registry (default); gh-import = the owner''s ZEN_RING_IMPORT secret; gh-secret = the legacy payload secret'
        type: choice
        options: [cf, gh-import, gh-secret]
        default: cf
      import:
        description: 'before anything else: upsert the source rows into the worker registry (one-off migration)'
        type: boolean
        default: false
      provision:
        description: 'write the worker files/vars/secrets into each ring repo before registering'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: read ring rows
        env:
          BASE: ${{ vars.ZEN_RUNNER_URL }}
          SOURCE: ${{ inputs.source }}
          RING_ADMIN: ${{ secrets.ZEN_RING_ADMIN_TOKEN }}
          RING_PAYLOAD: ${{ secrets.ZEN_RING_PAYLOAD }}
          RING_IMPORT: ${{ secrets.ZEN_RING_IMPORT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .ring
          if [ "$SOURCE" = "cf" ]; then
            code=$(curl -sS -o .ring/payload.json -w '%{http_code}' \
              -H "authorization: Bearer $RING_ADMIN" -H 'accept: application/json' "$BASE/zen/ring/payload")
            if [ "$code" != "200" ]; then
              echo "::error::the ring registry did not answer ($code): $(jq -r '.error // "no detail"' .ring/payload.json 2>/dev/null || echo unreadable)"
              echo "::error::the ring lives in the worker's D1 now — fix ZEN_RING_ADMIN_TOKEN in this repo, or run with source=gh-import and a ZEN_RING_IMPORT secret."
              exit 1
            fi
            jq -c '.repos' .ring/payload.json > .ring/ring.json
          elif [ "$SOURCE" = "gh-import" ]; then
            # The owner's self-service entrance: one secret, a JSON array of rows. The secret is
            # deleted from the job as soon as it is read — it never reaches a log or an input.
            printf '%s' "$RING_IMPORT" > .ring/ring.json
          else
            printf '%s' "$RING_PAYLOAD" > .ring/ring.json
          fi
          node -e 'const a=JSON.parse(require("fs").readFileSync(".ring/ring.json","utf8")); if(!Array.isArray(a)||!a.length) throw new Error("ring rows are not a non-empty JSON array"); for (const r of a) if(!/^[\w.-]+\/[\w.-]+$/.test(r.repo||"")) throw new Error("bad repo: "+r.repo); console.log("RING_ROWS="+a.length)'
          # Mask every token before any later command could print one. A token fetched at runtime is
          # NOT masked by GitHub on its own — only secrets are.
          jq -r '.[] | (.token // empty), (.resolved_token // empty)' .ring/ring.json | while IFS= read -r t; do
            if [ -n "$t" ]; then echo "::add-mask::$t"; fi
          done

      - name: import rows into the registry
        if: ${{ inputs.import }}
        env:
          BASE: ${{ vars.ZEN_RUNNER_URL }}
          RING_ADMIN: ${{ secrets.ZEN_RING_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          jq -c '.[]' .ring/ring.json | while read -r row; do
            repo=$(jq -r '.repo' <<<"$row")
            jq -c '{repo, location:(.location // "")}
                   + (if .token then {token:.token} else {} end)
                   + (if .token_ref then {token_ref:.token_ref} else {} end)' <<<"$row" > /tmp/body.json
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$BASE/zen/repos" \
              -H "authorization: Bearer $RING_ADMIN" -H 'content-type: application/json' --data @/tmp/body.json)
            echo "import $repo http=$code $(jq -r '.error // "ok"' /tmp/resp.json 2>/dev/null || echo ok)"
          done

      - name: provision ring repositories
        if: ${{ inputs.provision }}
        env:
          RUNNER_URL: ${{ vars.ZEN_RUNNER_URL }}
          RUNNER_TOKEN: ${{ secrets.ZEN_RUNNER_TOKEN }}
          DAILY_BUDGET: '8000'
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RUNNER_TOKEN" > /tmp/runner-token
          # Each row carries its own token: the ring is per-repo, so provisioning must be too.
          # An `env:NAME` row has no `token` of its own — the worker hands over `resolved_token` for
          # exactly this step (and never writes it back, so the reference stays rotatable).
          jq -c '.[]' .ring/ring.json | while read -r row; do
            repo=$(jq -r '.repo' <<<"$row")
            pat=$(jq -r '.token // .resolved_token // empty' <<<"$row")
            if [ -z "$pat" ]; then echo "provision $repo skipped — the registry has no token for this row"; continue; fi
            for f in .github/workflows/zen-pool.yml scripts/zen-pool-worker.mjs scripts/zen-client.mjs scripts/zen-pool-prune.mjs scripts/zen-pool-policy.mjs; do
              # The ladder repo is the source of truth for the worker code — pull from there, not
              # from this repo, so a worker change lands in the ring on the next sync. The sweep
              # script is the exception: it is ring policy, and the ladder repo is pull-only for the
              # ring owner, so it is pulled from this repository instead. And always overwrite: the
              # old "skip if present" left stale workers serving empty prompts.
              # The contents API needs the existing file's sha to overwrite it — without it the PUT
              # answers 422 and the ring keeps the stale worker.
              case "$f" in
                scripts/zen-pool-prune.mjs|scripts/zen-pool-policy.mjs) src="https://raw.githubusercontent.com/zen-rings/zen-rings/main/$f" ;;
                *) src="https://raw.githubusercontent.com/trained-assist/trained-assist-llm-ladder/main/$f" ;;
              esac
              content=$(curl -sS "$src" | base64 -w0)
              sha=$(curl -sS -H "authorization: Bearer $pat" "https://api.github.com/repos/$repo/contents/$f" | jq -r '.sha // empty')
              jq -n --arg msg "zen-pool: sync $f" --arg content "$content" --arg sha "$sha" \
                '{message:$msg, content:$content, branch:"main"} + (if $sha != "" then {sha:$sha} else {} end)' > /tmp/req.json
              code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PUT \
                -H "authorization: Bearer $pat" -H 'accept: application/vnd.github+json' -H 'content-type: application/json' \
                "https://api.github.com/repos/$repo/contents/$f" --data @/tmp/req.json)
              echo "provision $repo $f PUT=$code $(jq -r '.message // "ok"' /tmp/resp.json 2>/dev/null || echo ok)"
            done
            code=$(GH_TOKEN="$pat" gh variable set ZEN_RUNNER_URL --repo "$repo" --body "$RUNNER_URL" >/dev/null 2>&1; echo $?)
            echo "provision $repo var ZEN_RUNNER_URL rc=$code"
            code=$(GH_TOKEN="$pat" gh variable set ZEN_DAILY_BUDGET --repo "$repo" --body "$DAILY_BUDGET" >/dev/null 2>&1; echo $?)
            echo "provision $repo var ZEN_DAILY_BUDGET rc=$code"
            code=$(GH_TOKEN="$pat" gh secret set ZEN_RUNNER_TOKEN --repo "$repo" < /tmp/runner-token >/dev/null 2>&1; echo $?)
            echo "provision $repo secret ZEN_RUNNER_TOKEN rc=$code"
          done
          rm -f /tmp/runner-token

      - name: readable workflow names
        if: ${{ inputs.provision }}
        env:
          FRIENDLY_WORKER_NAME: 'Zen Pool — inference worker'
        run: |
          # The source file still says `name: zen-pool`, so a provision would put the bare name back.
          # This rewrites only that one top-level line, right after the file is written.
          # `--ensure-sweep` does the same for the ring-only sweep step: the worker workflow is
          # pulled from the ladder repo, which the ring owner cannot write to, so the step that lets
          # a worker sweep its own repository has to be injected here instead.
          node scripts/ring-hygiene.mjs --ring .ring/ring.json --rename-workflows --ensure-sweep \
            --friendly-name "${FRIENDLY_WORKER_NAME}" || true

      - name: register ring rows
        if: ${{ inputs.mode != 'list' }}
        env:
          MODE: ${{ inputs.mode }}
          BASE: ${{ vars.ZEN_RUNNER_URL }}
          RING_ADMIN: ${{ secrets.ZEN_RING_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          jq -c '.[]' .ring/ring.json | while read -r row; do
            repo=$(jq -r '.repo' <<<"$row")
            if [ "$MODE" = "disable" ]; then
              jq -c '{repo, enabled:false}' <<<"$row" > /tmp/body.json
            else
              # `enabled` comes from the row: the registry carries switched-off rows too, and
              # mode=register must not silently put one back in the ring (that is exactly how a repo
              # with no zen-run trigger got re-enabled on the first cf run). Compare against `false`
              # explicitly — jq's `//` treats false as empty, so `(.enabled // true)` would flip it
              # back to true.
              jq -c '{repo, location:(.location // ""), enabled:(.enabled != false)}
                     + (if .token then {token:.token} else {} end)
                     + (if .token_ref then {token_ref:.token_ref} else {} end)' <<<"$row" > /tmp/body.json
            fi
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$BASE/zen/repos" \
              -H "authorization: Bearer $RING_ADMIN" -H 'content-type: application/json' --data @/tmp/body.json)
            echo "register $repo http=$code $(jq -r '.error // "ok"' /tmp/resp.json 2>/dev/null || echo ok)"
          done

      - name: ring state
        if: always()
        env:
          BASE: ${{ vars.ZEN_RUNNER_URL }}
          RING_ADMIN: ${{ secrets.ZEN_RING_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          echo "--- zen/health ---"; curl -sS "$BASE/zen/health"; echo
          echo "--- zen/pool/health ---"; curl -sS "$BASE/zen/pool/health"; echo
          echo "--- zen/ring/repos ---"
          curl -sS -H "authorization: Bearer $RING_ADMIN" "$BASE/zen/ring/repos" | jq -c '{source, repos:[.repos[]|{repo,enabled,location,token_ref,has_token}]}' || echo "registry read-out refused — is ZEN_RING_ADMIN_TOKEN published to the worker?"
