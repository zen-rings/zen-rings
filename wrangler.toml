# The Zen worker has its OWN name and domain, separate from the company ladder worker
# (trained-assist-llm-ladder / llm-ladder.trainedassist.store). They used to share one worker,
# so a deploy from here could overwrite the production ladder that real users call. A distinct
# name makes `wrangler deploy` in this repo physically unable to touch the company worker.
name = "zen-rings"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
routes = [
  { pattern = "zen-rings.trainedassist.store", custom_domain = true }
]


# Persistent Workers Logs (queryable in the dashboard) — every ladder call logs its attempts.
[observability]
enabled = true

# One global LadderState instance: model health + Go key rotation, strongly consistent.
[[durable_objects.bindings]]
name = "LADDER_STATE"
class_name = "LadderState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LadderState"]

# Trace calls D1: one row per /v1/chat/completions, keyed by the caller's trace ids
# (x-ladder-trace/run/user/chat/session — set by the agent runner). The deploy job
# (ci.yml) provisions the database and rewrites the placeholder id before deploying.
[[d1_databases]]
binding = "LADDER_TRACE_DB"
database_name = "zen-rings-trace"
database_id = "11111111-1111-1111-1111-111111111111"

# Secrets (wrangler secret put): LADDER_TOKEN, OPENCODE_GO_API_KEYS, OPENROUTER_API_KEY,
# OPENCODE_ZEN_RELAY_TOKEN, POOL_TRIGGER_TOKEN, GITHUB_AI_AGENT_RUNS_POOL

# Zen Runner — availability table, budget counters and the runner-repository registry. Separate
# database on purpose: it is written by a cron sweep, and a stuck write must never touch traces.
# The deploy job (ci.yml) provisions it and rewrites the placeholder id before deploying.
[[d1_databases]]
binding = "ZEN_DB"
database_name = "zen-rings-zen"
database_id = "22222222-2222-2222-2222-222222222222"

# Re-check quarantined free models whose backoff expired (see src/zen-runner.js zenSweep).
[triggers]
crons = ["*/15 * * * *"]
