# The Zen worker has its OWN name and domain, separate from the company ladder worker
# (trained-assist-llm-ladder / llm-ladder.trainedassist.store). They used to share one worker,
# so a deploy from here could overwrite the production ladder that real users call. A distinct
# name makes `wrangler deploy` in this repo physically unable to touch the company worker.
name = "zen-rings"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
routes = [
  { pattern = "zen-rings.trainedassist.store", custom_domain = true }
]


# Persistent Workers Logs (queryable in the dashboard) — every ring call logs its attempts.
[observability]
enabled = true

# LadderState (model health + Go key rotation) and LADDER_TRACE_DB served the chat API this
# worker no longer has. They were created by migration v1 on the *deployed* worker, so v1 stays
# untouched as history and the class is retired in its own tag — wrangler refuses to edit an
# applied migration. NOTE: run `wrangler migrations list` before the first deploy after this
# change and confirm the deletion is pending; that is the one step that cannot be tested offline.

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LadderState"]

[[migrations]]
tag = "v2"
deleted_classes = ["LadderState"]

# Secrets (wrangler secret put): POOL_TRIGGER_TOKEN, GITHUB_AI_AGENT_RUNS_POOL, ZEN_RUNNER_TOKEN,
# ZEN_TOKEN_KEY, ZEN_RING_ADMIN_TOKEN. No LADDER_TOKEN: there is no ladder here to authenticate.

# Zen Runner — availability table, budget counters and the runner-repository registry. Separate
# database on purpose: it is written by a cron sweep, and a stuck write must never touch traces.
# The deploy job (ci.yml) provisions it and rewrites the placeholder id before deploying.
[[d1_databases]]
binding = "ZEN_DB"
database_name = "zen-rings-zen"
database_id = "22222222-2222-2222-2222-222222222222"

# Re-check quarantined free models whose backoff expired (see src/zen-runner.js zenSweep).
[triggers]
crons = ["*/15 * * * *"]
